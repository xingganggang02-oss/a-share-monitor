<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="/manifest.json"><title>A股智能监控</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top)+12px) 15px 35px}.head{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 16px}.title{font-size:28px;font-weight:800}.sub,.hint,.code,.foot{color:#8e96a3;font-size:11px}.sub{margin-top:4px}.online{font-size:12px;color:#60df82;background:#17331f;border-radius:20px;padding:7px 10px}.card{background:#15181e;border:1px solid #252a33;border-radius:18px;padding:16px;margin:10px 0}h2{font-size:16px;margin:0 0 13px}.grid,.detail{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box,.metric{background:#101318;border-radius:13px;padding:12px}.label,.metric .k{font-size:11px;color:#8e96a3}.big{font-size:19px;font-weight:800;margin-top:6px}.y{color:#ffc15a}.r{color:#ff6b6b}.g{color:#60df82}.search{display:flex;gap:8px}.search input{flex:1;background:#101318;border:1px solid #303640;color:#fff;border-radius:13px;padding:14px;font-size:16px;outline:none}.search button,button{border:0;border-radius:13px;padding:13px 15px;background:#f2f3f5;color:#0b0d10;font-weight:750}.item{padding:13px 0;border-bottom:1px solid #252932}.item:last-child{border:0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750}.tag{font-size:12px;padding:6px 9px;border-radius:9px;background:#20252e;white-space:nowrap}.reason{font-size:12px;color:#abb1bc;line-height:1.55;margin-top:7px}.metric .v{font-size:15px;font-weight:700;margin-top:4px}.actionbox{margin-top:11px;background:#101318;border-radius:14px;padding:13px}.actionbox strong{font-size:19px}.actionbox p{margin:7px 0 0;color:#b8bec8;font-size:12px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.outline{background:#20252e;color:#fff}.foot{text-align:center;line-height:1.5;margin-top:14px}</style></head><body><main>
<div class="head"><div><div class="title">A股智能监控</div><div class="sub">实时行情 · 股票分析 · 持仓 · 风险预警</div></div><div id="online" class="online">● 准备中</div></div>
<div class="card"><h2>🔎 随手分析股票</h2><div class="search"><input id="code" inputmode="numeric" maxlength="6" placeholder="输入股票代码，例如 300308"><button onclick="analyze()">分析</button></div><div class="hint" style="margin-top:8px">沪市：6/68开头　深市：0/2/3开头</div><div id="result"></div></div>
<div class="card"><h2>今日总判断</h2><div class="grid"><div class="box"><div class="label">市场环境</div><div id="env" class="big y">等待数据</div></div><div class="box"><div class="label">总操作</div><div id="act" class="big">等待</div></div><div class="box"><div class="label">海外风险</div><div id="risk" class="big y">监控</div></div><div class="box"><div class="label">数据状态</div><div id="rt" class="big">准备中</div></div></div></div>
<div class="card"><h2>💼 我的持仓</h2><div id="hold"></div></div><div class="card"><h2>⭐ 我的自选</h2><div id="watch"></div></div><button style="width:100%" onclick="load()">🔄 刷新行情</button><div class="foot">行情来自iTick；分析仅供信息参考，不构成投资建议。行情权限与刷新频率以实际授权为准。</div></main>
<script>
const DH=[{code:'000977',name:'浪潮信息',shares:200,cost:71},{code:'002049',name:'紫光国微',shares:100,cost:null},{code:'半导体',name:'半导体仓位',shares:7600,cost:null}],DW=['600160','600176','600183','000977','002436','002008','002428','002636','603256','603228'];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const pct=v=>v==null?'—':Number(v).toFixed(2)+'%';const cls=a=>['回避','风险大于机会','逢高减仓'].includes(a)?'r':['分批买入','积极关注'].includes(a)?'g':'y';
function hold(){document.getElementById('hold').innerHTML=get('holdings',DH).map(x=>`<div class=item><div class=row><div><div class=name>${esc(x.name)}</div><div class=code>${esc(x.code)} · ${x.shares}股</div></div><div class=tag>${x.cost==null?'观察仓':'成本 '+x.cost}</div></div></div>`).join('')}
function watch(d){let a=get('watchlist',DW),m={};d.forEach(x=>m[x.code]=x);document.getElementById('watch').innerHTML=a.map(c=>{let x=m[c];return x?`<div class=item><div class=row><div><div class=name>${esc(x.name)}</div><div class=code>${x.code}</div></div><div style="text-align:right"><div class=name>${x.price??'—'}</div><div class=code>${pct(x.change_pct)}</div></div></div><div class=actions><button class=outline onclick="analyze('${x.code}')">查看分析</button><button class=outline onclick="removeW('${x.code}')">移出</button></div></div>`:`<div class=item>${c} · 等待行情</div>`}).join('')}
function removeW(c){put('watchlist',get('watchlist',DW).filter(x=>x!==c));load()}function addW(c){let a=get('watchlist',DW);if(!a.includes(c))a.push(c);put('watchlist',a);load()}
async function analyze(c){c=(c||document.getElementById('code').value).trim();if(!/^\d{4,6}$/.test(c)){result.innerHTML='<div class=hint>请输入正确股票代码</div>';return}result.innerHTML='<div class=hint style="margin-top:10px">正在获取实时行情并分析…</div>';try{let r=await fetch('/api/analyze?code='+c),d=await r.json();if(!r.ok)throw Error(d.detail||'分析失败');let g=Object.entries(d.global||{}).map(([k,v])=>k+' '+pct(v.chp)).join(' · ')||'暂无';result.innerHTML=`<div class=item><div class=row><div><div class=name style="font-size:19px">${esc(d.name)}</div><div class=code>${d.code} · ${d.region} · ${esc(d.industry||'行业未知')}</div></div><div style="text-align:right"><div class=name style="font-size:20px">${d.price??'—'}</div><div class=${cls(d.action)}>${pct(d.change_pct)}</div></div></div><div class=actionbox><strong class=${cls(d.action)}>${esc(d.action)}</strong><p>${esc(d.reason)}</p><p><b>仓位：</b>${esc(d.position)}</p></div><div class=detail><div class=metric><div class=k>最高</div><div class=v>${d.high??'—'}</div></div><div class=metric><div class=k>最低</div><div class=v>${d.low??'—'}</div></div><div class=metric><div class=k>成交量</div><div class=v>${d.volume==null?'—':Number(d.volume).toLocaleString()}</div></div><div class=metric><div class=k>PE</div><div class=v>${d.pe==null?'—':Number(d.pe).toFixed(1)}</div></div><div class=metric><div class=k>日内位置</div><div class=v>${d.day_position==null?'—':d.day_position+'%'}</div></div><div class=metric><div class=k>评分</div><div class=v>${d.score}/100</div></div></div><div class=hint style="margin-top:10px">海外：${esc(g)}</div><div class=actions><button onclick="addW('${d.code}')">⭐ 加入自选</button><button class=outline onclick="result.innerHTML=''">收起</button></div></div>`}catch(e){result.innerHTML='<div class=hint>分析失败：'+esc(e.message)+'</div>'}}
async function load(){try{let r=await fetch('/api/status'),d=await r.json();online.textContent=d.realtime?'● 实时监控':'● 等待行情接入';rt.textContent=d.realtime?'实时':'待接入';env.textContent=d.environment||'等待';act.textContent=d.action||'等待';let q=Object.values(d.global||{}).map(x=>Number(x.chp||0));risk.textContent=q.some(x=>x<=-1)?'偏高':'监控';hold();watch(d.watchlist||[])}catch(e){online.textContent='● 离线'}}hold();load();setInterval(load,15000);</script></body></html>
